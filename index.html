<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS HANN 25</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* CSS Body & Background */
        body { 
            background-color: #121212; 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
        }

        /* Container Utama */
        #capture-area {
            padding: 20px;
            background-color: #121212;
        }

        /* Kartu QRIS Putih */
        .qris-card { 
            background: #ffffff; 
            border-radius: 45px; 
            padding: 45px 35px; 
            text-align: center; 
            width: 330px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
        }

        /* Bagian Nama Merchant */
        .label-merchant { 
            font-size: 11px; 
            color: #8e8e8e; 
            letter-spacing: 2px; 
            margin-bottom: 6px; 
            font-weight: 600; 
        }
        .merchant-name { 
            font-size: 26px; 
            font-weight: 700; 
            margin: 0 0 25px 0; 
            color: #202020; 
            text-transform: uppercase;
        }

        /* Bingkai QR Code */
        .qr-wrapper { 
            border: 1.5px solid #f2f2f2; 
            border-radius: 25px; 
            padding: 20px; 
            margin-bottom: 30px; 
        }
        .qr-wrapper img { 
            width: 100%; 
            display: block; 
            border-radius: 10px;
        }

        /* Bagian Tagihan */
        .label-tagihan { 
            font-size: 11px; 
            color: #8e8e8e; 
            letter-spacing: 2px; 
            margin-bottom: 8px; 
            font-weight: 600; 
        }
        .amount { 
            font-size: 38px; 
            font-weight: 600; 
            margin: 0 0 30px 0; 
            color: #000000; 
        }

        .divider { 
            border: 0; 
            border-top: 1.5px solid #f0f0f0; 
            margin-bottom: 25px; 
        }

        /* Tombol Simpan gaya Foto Kedua */
        .download-btn { 
            background: none; 
            border: none; 
            color: #1a73e8; 
            font-weight: 700; 
            font-size: 13px; 
            letter-spacing: 1.2px; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            width: 100%; 
            text-decoration: none; 
            padding-bottom: 5px;
        }
        .download-btn img {
            margin-right: 10px;
            width: 18px;
            filter: invert(33%) sepia(91%) saturate(1837%) hue-rotate(202deg) brightness(97%) contrast(92%);
        }
    </style>
</head>
<body>

<div id="capture-area">
    <div class="qris-card">
        <p class="label-merchant">MERCHANT NAME</p>
        <h2 class="merchant-name">HANN 25</h2>
        
        <div class="qr-wrapper">
            <img id="qris-image" src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=HANN25-SAMPLE" alt="QR Code">
        </div>

        <p class="label-tagihan">TOTAL TAGIHAN</p>
        <h1 class="amount">Rp 6.868</h1>
        
        <hr class="divider">

        <button class="download-btn" id="save-btn">
            <img src="https://img.icons8.com/material-sharp/24/000000/save-as.png" alt="save">
            <span>SIMPAN KE GALERI</span>
        </button>
    </div>
</div>

<script>
    document.getElementById('save-btn').addEventListener('click', function() {
        const target = document.querySelector('.qris-card');
        const btn = this;

        // Sembunyikan tombol sebentar agar tidak ikut kefoto
        btn.style.visibility = 'hidden';

        html2canvas(target, {
            backgroundColor: '#ffffff', // Latar belakang foto jadi putih bersih
            scale: 3, // Kualitas tinggi (HD)
            useCORS: true // Supaya gambar QR dari luar mau muncul di foto
        }).then(canvas => {
            const link = document.createElement('a');
            link.download = 'QRIS-HANN25.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
            
            // Tampilkan kembali tombolnya
            btn.style.visibility = 'visible';
        });
    });
</script>

</body>
</html>
