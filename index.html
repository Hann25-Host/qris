<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS HANN25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f0f0f; color: white; }
        .card-bg { background-color: #1a1a1a; border: 1px solid #2a2a2a; }
        .input-bg { background-color: #262626; }
        
        #capture-frame { 
            background: #ffffff; 
            color: #000; 
            width: 350px; 
            margin: 0 auto; 
            border-radius: 2.5rem;
        }

        .btn-download-custom {
            background-color: #161616;
            border: 1px solid #2a2a2a;
            border-radius: 1.5rem;
            padding: 1.25rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s;
            margin-top: 1.5rem;
            cursor: pointer;
        }
        .btn-download-custom:active { transform: scale(0.98); background-color: #202020; }
        .btn-download-custom span {
            color: #ffffff;
            font-weight: 800;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .emoji-floppy { font-size: 1.5rem; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-sm text-center">
        <h1 class="text-2xl font-800 tracking-tight mb-1 uppercase">
            QRIS <span class="text-blue-500">HANN25</span>
        </h1>
        <p class="text-zinc-500 text-[10px] tracking-[0.2em] mb-8 uppercase text-center">Secure Payment Terminal</p>

        <div class="card-bg rounded-[2.5rem] p-8 shadow-2xl mb-8">
            <div class="text-left mb-6">
                <label class="text-[10px] font-bold text-zinc-500 mb-3 block uppercase tracking-widest ml-1">Nominal Bayar</label>
                <div class="relative">
                    <span class="absolute left-5 top-1/2 -translate-y-1/2 text-zinc-400 font-semibold text-lg">Rp</span>
                    <input type="text" id="amountDisplay" placeholder="0" inputmode="numeric" 
                           oninput="formatRupiah(this)"
                           onkeydown="if(event.key === 'Enter') { generateQRIS(); this.blur(); }"
                           class="w-full input-bg border-none rounded-2xl py-5 pl-14 pr-6 text-2xl font-bold focus:ring-2 focus:ring-blue-600 outline-none text-white">
                </div>
            </div>
            
            <button onclick="generateQRIS()" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-[0.97] text-lg uppercase">
                Generate QRIS
            </button>
        </div>

        <div id="result-area" class="hidden animate-in fade-in duration-500">
            <div id="capture-frame" class="p-10 shadow-2xl text-center">
                <div class="mb-6">
                    <p class="text-[10px] font-bold tracking-[0.3em] uppercase text-zinc-400 mb-1">Merchant Name</p>
                    <p class="text-2xl font-800 uppercase tracking-tight">HANN 25</p>
                </div>

                <div class="bg-white p-4 rounded-2xl inline-block mx-auto mb-6">
                    <div id="qrcode" class="flex justify-center"></div>
                </div>

                <div class="space-y-1">
                    <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-zinc-500">Total Tagihan</p>
                    <p id="display-amount" class="text-4xl font-800 text-black"></p>
                </div>
                
                <div class="mt-8 pt-5 border-t border-zinc-100">
                    <p class="text-[9px] font-bold uppercase tracking-[0.2em] text-zinc-400">Scan & Bayar Sekarang</p>
                </div>
            </div>

            <button onclick="downloadPoster()" class="btn-download-custom">
                <span class="emoji-floppy">💾</span>
                <span>Simpan ke Galeri</span>
            </button>
        </div>
    </div>

    <script>
        function formatRupiah(el) {
            let val = el.value.replace(/[^0-9]/g, '');
            el.value = val !== "" ? parseInt(val).toLocaleString('id-ID') : "";
        }

        function generateQRIS() {
            const displayVal = document.getElementById('amountDisplay').value;
            const rawAmount = displayVal.replace(/[^0-9]/g, '');
            
            if (!rawAmount || rawAmount < 1) {
                alert("Isi nominal dulu bang!");
                return;
            }

            const qrisData = "00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214532503957167510303UMI51440014ID.CO.QRIS.WWW0215ID20253773559250303UMI5204481253033605802ID5917HANN 25 OK22116546010PEKALONGAN61055111162070703A01";
            const amountStr = "54" + ("00" + rawAmount.length).slice(-2) + rawAmount;
            const finalQRIS = qrisData + amountStr + "6304" + calcCRC16(qrisData + amountStr + "6304");

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            
            // Render QR sebagai gambar (useSVG: false defaultnya bakal bikin img tag juga)
            new QRCode(qrContainer, {
                text: finalQRIS,
                width: 250,
                height: 250,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            document.getElementById('display-amount').innerText = "Rp " + parseInt(rawAmount).toLocaleString('id-ID');
            document.getElementById('result-area').classList.remove('hidden');
            
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        async function downloadPoster() {
            const frame = document.getElementById('capture-frame');
            
            // KUNCINYA DI SINI:
            // Ambil elemen img yang dibuat otomatis sama qrcode.js
            const qrImg = document.querySelector('#qrcode img');
            if (qrImg) {
                // Paksa source gambar di-load ulang biar html2canvas nggak skip
                const src = qrImg.src;
                qrImg.src = src; 
            }

            // Tunggu sebentar biar render beneran kelar
            await new Promise(resolve => setTimeout(resolve, 200));

            html2canvas(frame, { 
                scale: 4, // Makin tinggi biar makin HD pas di-print/scan
                useCORS: true,
                allowTaint: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `QRIS_HANN25_${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        }

        function calcCRC16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= str.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
                    else crc <<= 1;
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }
    </script>
</body>
</html>
