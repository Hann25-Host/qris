<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS HANN25 - Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #0f0f0f; 
            color: white; 
            margin: 0; 
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card-bg { background-color: #1a1a1a; border: 1px solid #2a2a2a; }
        .input-bg { background-color: #262626; }
        
        #capture-area {
            padding: 20px;
            display: flex;
            justify-content: center;
            background-color: transparent;
        }

        #capture-frame { 
            background: #ffffff; 
            color: #000; 
            width: 350px; 
            border-radius: 2.5rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
        }

        .btn-download-custom {
            background-color: #111111;
            border: 1px solid #222222;
            border-radius: 1.5rem;
            padding: 1.25rem;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            transition: all 0.2s;
            cursor: pointer;
            margin-top: 1rem;
        }
        .btn-download-custom:active { transform: scale(0.98); }
        .btn-download-custom .icon-emoji { font-size: 1.2rem; }
        .btn-download-custom span {
            color: #999999;
            font-weight: 800;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
        }
        
        #qrcode { display: flex; justify-content: center; align-items: center; }
        #qrcode canvas, #qrcode img { display: block; margin: 0 auto; border-radius: 8px; }
    </style>
</head>
<body class="p-6">

    <div class="w-full max-w-sm flex flex-col items-center">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-800 tracking-tight mb-1 uppercase">
                QRIS <span class="text-blue-500">HANN25</span>
            </h1>
            <p class="text-zinc-500 text-[10px] tracking-[0.2em] uppercase">Secure Payment Terminal</p>
        </div>

        <div class="card-bg rounded-[2.5rem] p-8 shadow-2xl mb-8 w-full">
            <div class="text-left mb-6">
                <label class="text-[10px] font-bold text-zinc-500 mb-3 block uppercase tracking-widest ml-1">Nominal Bayar</label>
                <div class="relative">
                    <span class="absolute left-5 top-1/2 -translate-y-1/2 text-zinc-400 font-semibold text-lg">Rp</span>
                    <input type="text" id="amountDisplay" placeholder="0" inputmode="numeric" 
                           oninput="formatRupiah(this)"
                           onkeydown="if(event.key === 'Enter') { this.blur(); generateQRIS(); }"
                           class="w-full input-bg border-none rounded-2xl py-5 pl-14 pr-6 text-2xl font-bold focus:ring-2 focus:ring-blue-600 outline-none text-white">
                </div>
            </div>
            <button onclick="generateQRIS()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-[0.97] text-lg uppercase">
                Generate QRIS
            </button>
        </div>

        <div id="result-area" class="hidden w-full flex flex-col items-center">
            <div id="capture-area">
                <div id="capture-frame">
                    <div class="mb-6 text-center">
                        <p class="text-[10px] font-bold tracking-[0.3em] uppercase text-zinc-400 mb-1">Merchant Name</p>
                        <p class="text-2xl font-800 uppercase tracking-tight">HANN 25</p>
                    </div>

                    <div class="bg-white p-2 mb-6">
                        <div id="qrcode"></div>
                    </div>

                    <div class="space-y-1 text-center">
                        <p class="text-[10px] font-bold uppercase tracking-[0.2em] text-zinc-500">Total Tagihan</p>
                        <p id="display-amount" class="text-4xl font-800 text-black"></p>
                    </div>
                    
                    <div class="mt-8 pt-5 border-t border-zinc-100 w-full text-center">
                        <p class="text-[9px] font-bold uppercase tracking-[0.2em] text-zinc-400">Scan & Bayar Sekarang</p>
                    </div>
                </div>
            </div>

            <div class="btn-download-custom" id="btn-save" onclick="downloadPoster()">
                <div class="icon-emoji">💾</div>
                <span>Simpan ke Galeri</span>
            </div>
        </div>
    </div>

    <script>
        function formatRupiah(el) {
            let val = el.value.replace(/[^0-9]/g, '');
            el.value = val !== "" ? parseInt(val).toLocaleString('id-ID') : "";
        }

        function generateQRIS() {
            const displayVal = document.getElementById('amountDisplay').value;
            const rawAmount = displayVal.replace(/[^0-9]/g, '');
            if (!rawAmount || rawAmount < 1) return alert("Isi nominal dulu Bang!");

            const qrisData = "00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214532503957167510303UMI51440014ID.CO.QRIS.WWW0215ID20253773559250303UMI5204481253033605802ID5917HANN 25 OK22116546010PEKALONGAN61055111162070703A01";
            const amountStr = "54" + ("00" + rawAmount.length).slice(-2) + rawAmount;
            const finalQRIS = qrisData + amountStr + "6304" + calcCRC16(qrisData + amountStr + "6304");

            const qrDiv = document.getElementById('qrcode');
            qrDiv.innerHTML = "";
            
            new QRCode(qrDiv, {
                text: finalQRIS,
                width: 250,
                height: 250,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            document.getElementById('display-amount').innerText = "Rp " + parseInt(rawAmount).toLocaleString('id-ID');
            document.getElementById('result-area').classList.remove('hidden');
            
            setTimeout(() => {
                window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
            }, 100);
        }

        async function downloadPoster() {
            const frame = document.getElementById('capture-frame');
            const btn = document.getElementById('btn-save');
            
            btn.style.opacity = "0.5";
            btn.querySelector('span').innerText = "PROSES...";

            const canvases = document.querySelectorAll('#qrcode canvas');
            if(canvases.length > 1) canvases[0].remove();

            await new Promise(r => setTimeout(r, 500));

            html2canvas(frame, { 
                scale: 3,
                useCORS: true,
                backgroundColor: "#ffffff"
            }).then(canvas => {
                const link = document.createElement('a');
                link.download = `HANN25_${Date.now()}.png`;
                link.href = canvas.toDataURL("image/png", 1.0);
                link.click();
                
                btn.style.opacity = "1";
                btn.querySelector('span').innerText = "SIMPAN KE GALERI";
            });
        }

        function calcCRC16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= str.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
                    else crc <<= 1;
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }
    </script>
</body>
</html>
