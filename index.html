<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS Payment - Hann25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-[#0f0f0f] text-white flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-sm">
        <div class="text-center mb-8">
            <h1 class="text-2xl font-800 tracking-tight">HANN25<span class="text-blue-500">HOST</span></h1>
            <p class="text-zinc-500 text-xs mt-1 tracking-[0.2em] uppercase">Secure Payment Terminal</p>
        </div>

        <div class="glass rounded-[2.5rem] p-8 shadow-2xl">
            <div class="mb-6">
                <label class="text-[10px] font-bold text-zinc-500 mb-2 block uppercase tracking-widest ml-1">Nominal Bayar</label>
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-zinc-400 font-semibold">Rp</span>
                    <input type="number" id="amount" placeholder="0" 
                           class="w-full bg-white/5 border border-white/10 rounded-2xl py-4 pl-12 pr-4 text-xl font-bold focus:outline-none focus:ring-2 focus:ring-blue-500/50 transition-all placeholder:text-zinc-700">
                </div>
            </div>
            
            <button onclick="generateQRIS()" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all shadow-[0_0_20px_rgba(37,99,235,0.3)] active:scale-[0.97]">
                Generate QRIS
            </button>

            <div id="qr-area" class="hidden mt-8 pt-8 border-t border-white/10 animate-fade-in">
                <div class="flex flex-col items-center">
                    <div id="qrcode" class="p-3 bg-white rounded-2xl shadow-[0_0_30px_rgba(255,255,255,0.1)]"></div>
                    <div class="mt-6 text-center">
                        <p class="text-zinc-500 text-[10px] uppercase tracking-widest mb-1">Total Tagihan</p>
                        <p id="display-amount" class="text-2xl font-800 text-white"></p>
                    </div>
                </div>
            </div>
        </div>

        <p class="text-center text-zinc-600 text-[10px] mt-8 uppercase tracking-widest">Otomatis • Aman • Terverifikasi</p>
    </div>

    <script>
        function generateQRIS() {
            const amountInput = document.getElementById('amount').value;
            if (!amountInput || amountInput < 1) return;

            // Data QRIS Statis lo
            let qrisData = "00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214532503957167510303UMI51440014ID.CO.QRIS.WWW0215ID20253773559250303UMI5204481253033605802ID5917HANN 25 OK22116546010PEKALONGAN61055111162070703A01";
            let fee = amountInput.toString();
            let amountStr = "54" + ("00" + fee.length).slice(-2) + fee;
            let qrisTanpaCRC = qrisData + amountStr + "6304";
            let crc = calcCRC16(qrisTanpaCRC);
            let finalQRIS = qrisTanpaCRC + crc;

            document.getElementById('qrcode').innerHTML = "";
            new QRCode(document.getElementById("qrcode"), {
                text: finalQRIS,
                width: 200,
                height: 200,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.M
            });

            document.getElementById('display-amount').innerText = "Rp " + parseInt(amountInput).toLocaleString('id-ID');
            document.getElementById('qr-area').classList.remove('hidden');
        }

        function calcCRC16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= str.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
                    else crc <<= 1;
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }
    </script>
</body>
</html>
