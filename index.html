<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QRIS HANN25</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f0f0f; }
        .card-bg { background-color: #1a1a1a; border: 1px solid #2a2a2a; }
        .input-bg { background-color: #262626; }
    </style>
</head>
<body class="text-white flex items-center justify-center min-h-screen p-6">

    <div class="w-full max-w-sm text-center">
        <h1 class="text-2xl font-700 tracking-tight mb-1 uppercase">
            QRIS <span class="text-blue-500">HANN25</span>
        </h1>
        <p class="text-zinc-500 text-[10px] tracking-[0.2em] mb-8 uppercase">Secure Payment Terminal</p>

        <div class="card-bg rounded-[2.5rem] p-8 shadow-2xl">
            <div class="text-left mb-6">
                <label class="text-[10px] font-bold text-zinc-500 mb-3 block uppercase tracking-widest ml-1">Nominal Bayar</label>
                <div class="relative">
                    <span class="absolute left-5 top-1/2 -translate-y-1/2 text-zinc-400 font-semibold text-lg">Rp</span>
                    <input type="text" id="amountDisplay" placeholder="0" inputmode="numeric" oninput="formatRupiah(this)"
                           class="w-full input-bg border-none rounded-2xl py-5 pl-14 pr-6 text-2xl font-bold focus:ring-2 focus:ring-blue-600 outline-none text-white placeholder:text-zinc-700">
                </div>
            </div>
            
            <button onclick="generateQRIS()" 
                    class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-4 rounded-2xl transition-all active:scale-[0.97] text-lg">
                Generate QRIS
            </button>

            <div id="qr-area" class="hidden mt-8 pt-8 border-t border-zinc-800">
                <div class="flex flex-col items-center">
                    <div id="qrcode" class="p-4 bg-white rounded-2xl"></div>
                    
                    <div class="mt-6">
                        <p class="text-zinc-500 text-[10px] uppercase tracking-widest mb-1">Total Tagihan</p>
                        <p id="display-amount" class="text-2xl font-bold text-white"></p>
                    </div>

                    <button onclick="downloadQR()" class="mt-6 flex items-center gap-2 text-blue-500 hover:text-blue-400 text-sm font-bold uppercase tracking-widest">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                        </svg>
                        Download QR (HD)
                    </button>
                </div>
            </div>
        </div>

        <p class="text-zinc-700 text-[10px] mt-8 uppercase tracking-[0.3em]">Otomatis • Aman • Terverifikasi</p>
    </div>

    <script>
        function formatRupiah(el) {
            let val = el.value.replace(/[^0-9]/g, '');
            if (val !== "") {
                el.value = parseInt(val).toLocaleString('id-ID');
            } else {
                el.value = "";
            }
        }

        function generateQRIS() {
            const displayVal = document.getElementById('amountDisplay').value;
            const rawAmount = displayVal.replace(/[^0-9]/g, '');
            
            if (!rawAmount || rawAmount < 1) {
                alert("Masukkan nominal bang!");
                return;
            }

            // Data QRIS Statis lo
            let qrisData = "00020101021126670016COM.NOBUBANK.WWW01189360050300000879140214532503957167510303UMI51440014ID.CO.QRIS.WWW0215ID20253773559250303UMI5204481253033605802ID5917HANN 25 OK22116546010PEKALONGAN61055111162070703A01";
            let amountStr = "54" + ("00" + rawAmount.length).slice(-2) + rawAmount;
            let qrisTanpaCRC = qrisData + amountStr + "6304";
            let crc = calcCRC16(qrisTanpaCRC);
            let finalQRIS = qrisTanpaCRC + crc;

            const qrContainer = document.getElementById('qrcode');
            qrContainer.innerHTML = "";
            
            // Set High Resolution 1000px
            new QRCode(qrContainer, {
                text: finalQRIS,
                width: 1000, 
                height: 1000,
                colorDark: "#000000",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });

            // Preview di browser tetep kecil biar rapi
            setTimeout(() => {
                const qrImg = qrContainer.querySelector('img');
                const qrCanv = qrContainer.querySelector('canvas');
                if(qrImg) qrImg.style.width = "200px";
                if(qrCanv) qrCanv.style.width = "200px";
            }, 50);

            document.getElementById('display-amount').innerText = "Rp " + parseInt(rawAmount).toLocaleString('id-ID');
            document.getElementById('qr-area').classList.remove('hidden');
        }

        function downloadQR() {
            const canvas = document.querySelector('#qrcode canvas');
            const rawAmount = document.getElementById('amountDisplay').value.replace(/[^0-9]/g, '');
            if (canvas) {
                const link = document.createElement('a');
                link.download = 'QRIS-HANN25-' + rawAmount + '.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            }
        }

        function calcCRC16(str) {
            let crc = 0xFFFF;
            for (let i = 0; i < str.length; i++) {
                crc ^= str.charCodeAt(i) << 8;
                for (let j = 0; j < 8; j++) {
                    if ((crc & 0x8000) !== 0) crc = (crc << 1) ^ 0x1021;
                    else crc <<= 1;
                }
            }
            return (crc & 0xFFFF).toString(16).toUpperCase().padStart(4, '0');
        }
    </script>
</body>
</html>
